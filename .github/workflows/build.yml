name: Build VST3
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      JUCE_TAG: "9.0.6"   
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libjack-jackd2-dev \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev libxi-dev

      - name: Get JUCE
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Configure
        run: cmake -S . -B build -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target MuseScoreJACKBridge_VST3 --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp -r "$(find build -name '*.vst3' -type d | head -n1)" dist/
          cd dist && zip -r ../MuseScoreJACKBridge-linux-x86_64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: MuseScoreJACKBridge-linux-x86_64
          path: MuseScoreJACKBridge-linux-x86_64.zip
